.pw2{--bg:#0a1a17;--pn:#112823;--pn2:#17342d;--ln:#2a5248;--tx:#f1ecdc;--mu:#9bb7ac;--br:#d6a846;--pa:#f4ecd6;--pa2:#e8dcbc;--pt:#2b2416;--gn:#4fd6a1;--am:#f0b84a;--rd:#ea5a4b;color:var(--tx);font:14px/1.45 Nunito,Arial,sans-serif;border-radius:18px;padding:12px;max-width:1200px;margin:auto;background:radial-gradient(900px 420px at 50% -8%,#1d4a3d 0,transparent 70%),linear-gradient(180deg,#0c1f1b,#08120f);border:1px solid #1f4036;box-shadow:0 20px 60px #0007}
.pw2 *{box-sizing:border-box}.pw2 h3{margin:0 0 6px;font:800 17px Bitter,Georgia,serif}.pw2 p{margin:0 0 10px;color:#d6e6dd}.pw2 small{color:var(--mu)}

.pw2 .seal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle at 35% 30%,#f2d27a,#b8862b);color:#3a2a06;box-shadow:0 0 0 3px #0d2420,0 0 0 5px var(--br)}
.pw2 .clk b{font:800 15px Bitter,Georgia,serif;display:block}.pw2 .clk span{color:var(--mu);font-size:12px}
.pw2 .tl{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin-top:6px}.pw2 .tl i{height:6px;border-radius:2px;background:#24443b}.pw2 .tl i.on{background:var(--br)}.pw2 .tl i.cur{background:var(--tx);animation:blink 1.4s infinite}

.pw2 .pkb small{font-size:11px;display:block;text-align:center}.pw2 .gem{display:inline-block;width:16px;height:16px;margin:4px 3px;transform:rotate(45deg);border-radius:3px;background:#24443b}.pw2 .gem.on{background:linear-gradient(135deg,#ffe08a,#d6a846);box-shadow:0 0 8px #d6a84699}

.pw2 .gz{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px 4px 6px;text-align:center}
.pw2 .ring{--v:50;--c:var(--gn);width:58px;height:58px;margin:0 auto 4px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),#24443b 0);display:grid;place-items:center;position:relative}
.pw2 .ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--pn)}.pw2 .ring span{position:relative;font:800 16px Bitter,Georgia,serif}
.pw2 .gz small{display:block;font-size:11px}.pw2 .gz em{font-size:11px;min-height:15px;display:block}
.pw2 .gz.warn{border-color:var(--rd);animation:alarm 1.2s infinite}@keyframes alarm{50%{box-shadow:0 0 14px #ea5a4b88}}
.pw2 .main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start}
.pw2 .desk{background:linear-gradient(180deg,#3a2a1a,#2a1d12);border:1px solid #5a432a;border-radius:16px;padding:14px;box-shadow:inset 0 0 40px #0006}
.pw2 .memo{background:var(--pa);color:var(--pt);border-radius:6px;padding:14px 16px 16px;box-shadow:0 10px 24px #0008;background-image:repeating-linear-gradient(transparent 0 27px,#d8c9a255 27px 28px);transform:rotate(-.3deg)}

.pw2 .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px solid var(--pt);padding-bottom:6px;margin-bottom:10px;font:700 12px Bitter,Georgia,serif;color:#5b4a28}
.pw2 .stamp{font:800 11px Nunito,sans-serif;border:2px solid;border-radius:4px;padding:2px 8px;transform:rotate(-4deg);white-space:nowrap}
.pw2 .stamp.rd{color:#b3261e}.pw2 .stamp.am{color:#a86a00}.pw2 .stamp.gn{color:#14774f}
.pw2 .mb{display:flex;gap:12px;align-items:flex-start}.pw2 .big{font-size:42px;line-height:1}.pw2 .memo h3{font:800 19px/1.25 Bitter,Georgia,serif;margin:0 0 6px}
.pw2 .q{display:block;color:#a86a00!important;font-weight:800;margin-bottom:4px}
.pw2 .opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:7px 0;padding:10px 12px;background:var(--pa2);color:var(--pt);border:1px solid #c9b88c;border-radius:10px;font-weight:700;transition:transform .12s,background .12s}
.pw2 .opt:hover{background:#fff7de;transform:translateX(4px);filter:none!important}
.pw2 .ltr{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pt);color:var(--pa);font:800 13px Bitter,serif;font-style:normal}
.pw2 .opt.alt{border-style:dashed;background:#dde5d3}
.pw2 .dec{background:#fffaf0;border:1px dashed #b49a5e;border-radius:8px;padding:12px;margin-top:10px;position:relative}.pw2 .dec .stamp{position:absolute;right:10px;top:-11px;background:var(--pa)}
.pw2 .dch span{display:inline-block;margin:6px 10px 0 0;font-weight:800;font-size:12px}
.pw2 .sign{display:block;width:100%;margin-top:10px;padding:12px;font:800 15px Bitter,Georgia,serif;color:#2b2008;background:linear-gradient(180deg,#f4d77f,#d6a846);border:1px solid #9a7425;border-radius:10px;box-shadow:0 4px 0 #8a6620}
.pw2 .sign:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6620}
.pw2 .side{display:grid;grid-template-columns:66px minmax(0,1fr);background:var(--pn);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.pw2 .rail{display:flex;flex-direction:column;background:#0c1f1b;border-right:1px solid var(--ln)}
.pw2 .rail button{border:0;border-radius:0;background:transparent;padding:10px 2px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;border-left:3px solid transparent}
.pw2 .rail button span{font-size:20px}.pw2 .rail button small{font-size:10px;line-height:1.1;color:inherit}
.pw2 .rail button.on{background:var(--pn2);color:var(--tx);border-left-color:var(--br)}.pw2 .tp{padding:12px;min-width:0}
.pw2 .box{background:#0c1f1b;border:1px solid var(--ln);border-radius:10px;padding:9px 11px;margin:8px 0}
.pw2 .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1f4036;flex-wrap:wrap}.pw2 .row small{display:block}.pw2 .row>span{min-width:0}.pw2 .row>span:last-child:not(:first-child){flex:0 0 auto}
.pw2 .lv{display:inline-flex;align-items:center;gap:4px}.pw2 .lv button{padding:3px 10px}.pw2 .lv b{min-width:22px;text-align:center}
.pw2 .bar{height:7px;background:#08140f;border-radius:5px;overflow:hidden;margin-top:5px}.pw2 .bar span{display:block;height:100%;background:var(--gn)}.pw2 .bar.mid span{background:var(--am)}.pw2 .bar.lo span{background:var(--rd)}
.pw2 .act{display:block;width:100%;text-align:left;margin:5px 0}.pw2 .act small{display:block;font-weight:600}.pw2 .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pw2 .g2 .act{margin:0}
.pw2 input[type=range]{width:100%;accent-color:var(--br)}
.pw2 .log{font-size:12px;color:#bcd6ca}.pw2 .log div{padding:6px 0;border-bottom:1px solid #1f4036}
.pw2 .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 14px Bitter,serif;font-style:normal;color:#fff;flex:0 0 auto;border:2px solid var(--br)}
.pw2 .vph{display:flex;gap:10px;align-items:center;margin-bottom:6px}.pw2 .vph h3{margin:0}
.pw2 .mrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #1f4036}.pw2 .mrow>span{flex:1;min-width:0}
.pw2 .sit{width:100%;background:#0c1f1b;border:1px solid var(--ln);border-radius:12px}.pw2 .dash{stroke-dasharray:6 4;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
.pw2 .mod{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:12px;background:#000b;backdrop-filter:blur(3px)}
.pw2 .mcard{width:min(520px,100%);max-height:92vh;overflow:auto;background:var(--pa);color:var(--pt);border-radius:10px;padding:16px;box-shadow:0 20px 60px #000;animation:slide .35s cubic-bezier(.2,.8,.2,1)}
.pw2 .mcard h3{font:800 20px Bitter,serif;border-bottom:2px solid var(--pt);padding-bottom:6px}.pw2 .mcard .g{color:#14774f}.pw2 .mcard .b{color:#b3261e}
.pw2 .fin{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.pw2 .fin div{background:var(--pa2);border-radius:8px;padding:6px 8px;text-align:center}.pw2 .fin small{color:#6b5a38;display:block;font-size:11px}.pw2 .fin b{font:800 15px Bitter,serif}
.pw2 .mg{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}.pw2 .mr{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px dotted #c9b88c;font-weight:700}
.pw2 .mcard ul{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:#4a3d22}
@media(max-width:900px){.pw2 .hud{grid-template-columns:auto 1fr}.pw2 .hud .chips,.pw2 .hud .pkb{grid-column:1/-1}.pw2 .pkb{text-align:center}.pw2 .main{grid-template-columns:1fr}.pw2 .gz-row{grid-template-columns:repeat(4,1fr)}}
